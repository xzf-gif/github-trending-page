name: Daily refresh

# 北京时间中午 12 点 = UTC 04:00
# 额外设置一个 cron 作为备用，避免 GitHub Actions 的 schedule 延迟。
on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '30 5 * * *'

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 使用阿里云百炼 / Qwen 构建
      - name: Build index.html
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}

          # 默认模型，可以改成你想使用的百炼模型
          BAILIAN_MODEL: qwen-plus

          # 阿里云百炼 OpenAI 兼容接口
          BAILIAN_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1

        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --staged --quiet; then
            echo "no changes — skipping commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "refresh: ${DATE} trending data"
            git push
          fi

      # 失败时创建或更新 Issue
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7

        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = '🔴 Daily refresh failures';
            const label = 'cron-failure';

            const { data: existing } =
              await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
                per_page: 1,
              });

            const body = [
              `**${today}** — Daily refresh workflow failed.`,
              ``,
              `[View run logs](${runUrl})`,
              ``,
              `Triggered by: \`${context.eventName}\` Run: \`${context.runId}\``,
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });

              core.notice(
                `Appended failure comment to #${existing[0].number}`
              );
            } else {
              const { data: created } =
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label],
                });

              core.notice(
                `Opened failure issue #${created.number}`
              );
            }
